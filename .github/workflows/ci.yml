# PR마다 포맷·타입 검사, 빌드, E2E(로컬 처리 약속 포함)를 돌려서 리뷰 전에 깨진 코드를 걸러낸다.
name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # README의 도구 목록이 레지스트리와 같은지 (도구를 더하고 README를 고치지 않으면 실패)
      - run: node scripts/readme/tools.mjs --check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # 실패한 E2E의 기록. 내려받아 npx playwright show-trace 로 본다
      # 재시도에서 통과해도 첫 실패의 기록은 남으므로 CI가 통과해도 올린다 (기록이 없으면 건너뜀)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
